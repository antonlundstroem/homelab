apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.19.1
    helm:
      valuesObject:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

        # CDI mode: device plugin advertises GPUs as CDI references; containerd
        # reads /var/run/cdi/nvidia-container-toolkit.json and injects devices.
        deviceListStrategy: cdi-annotations
        # Discover GPUs by parsing the CDI spec itself, not by calling NVML
        # inside the plugin pod. This sidesteps needing libnvidia-ml.so +
        # /dev/nvidiactl access in the plugin's own container.
        deviceDiscoveryStrategy: cdi
        nvidiaDriverRoot: /run/opengl-driver

        # Node Feature Discovery — labels nodes by hardware (PCI/CPU).
        nfd:
          enabled: true
          worker:
            tolerations:
              - operator: Exists

        # GPU Feature Discovery — adds nvidia.com/gpu.{product,memory,...}
        # labels. Needs the same NixOS driver root for its own NVML calls.
        gfd:
          enabled: true
          nvidiaDriverRoot: /run/opengl-driver
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
