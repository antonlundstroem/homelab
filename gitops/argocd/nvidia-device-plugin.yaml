apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.19.1
    helm:
      valuesObject:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

        # Route plugin + gfd pods through nvidia-container-runtime, which
        # applies the CDI spec on container start: mounts /dev/nvidia*,
        # bind-mounts the /nix/store driver libs, runs the update-ldcache
        # hook. Required because kubelet ≥1.28 no longer propagates pod
        # annotations to container CRI annotations, so containerd's native
        # CDI annotation injection can't reach these system pods. The
        # `nvidia` RuntimeClass is registered by k3s once nvidia-container-runtime
        # is on its service PATH and the runtime is forced into CDI mode
        # via /etc/nvidia-container-runtime/config.toml (see
        # nixos/nodes/gpu01/configuration.nix). Workload pods still get
        # GPUs via the device-plugin API + CDI list strategy below; the
        # runtime class is only needed for the bootstrap pods.
        runtimeClassName: nvidia

        # CDI list strategy: at runtime the plugin returns CDI device names
        # (nvidia.com/gpu=0, ...) from /var/run/cdi/*.json to kubelet, which
        # containerd (≥2.0, enable_cdi defaults true) then resolves into
        # device/mount/hook edits applied to *workload* pods via the device
        # plugin API. This is the modern post-1.28 CDI flow.
        deviceListStrategy: cdi-annotations

        # nvidiaDriverRoot: FHS-shaped wrapper on the host (see
        # nixos/nodes/gpu01/configuration.nix). The chart mounts this as
        # /driver-root in the pod so the plugin's CDI spec generator can
        # locate libcuda.so / libnvidia-ml.so / ... by path under
        # /driver-root/usr/lib64/ at startup. (NVML probe + runtime calls
        # work via ld.so.cache from CDI's update-ldcache hook regardless;
        # the wrapper is specifically for the discoverer's path resolution.)
        nvidiaDriverRoot: /var/lib/nvidia-driver-root

        # nvidiaDevRoot must be set separately to the host root, otherwise
        # it inherits from nvidiaDriverRoot and the plugin writes device
        # paths like /var/lib/nvidia-driver-root/dev/nvidia0 into the CDI
        # spec it generates for workload pods — those host paths don't
        # exist and containerd fails workload pods with "failed to stat
        # CDI host device". The real device nodes live at /dev/nvidia*.
        nvidiaDevRoot: /

        # Node Feature Discovery — labels nodes by hardware (PCI/CPU).
        nfd:
          enabled: true
          worker:
            tolerations:
              - operator: Exists

        # GPU Feature Discovery — adds nvidia.com/gpu.{product,memory,...}
        # labels. Doesn't generate CDI specs (just queries NVML), so it
        # tolerates the wrapper being absent — but we keep nvidiaDriverRoot
        # set here too for symmetry with the plugin's bootstrap.
        gfd:
          enabled: true
          nvidiaDriverRoot: /var/lib/nvidia-driver-root
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
