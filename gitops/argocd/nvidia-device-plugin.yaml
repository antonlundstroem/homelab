apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.19.1
    helm:
      valuesObject:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

        # Route plugin + gfd pods through nvidia-container-runtime, which
        # applies the CDI spec on container start: mounts /dev/nvidia*,
        # bind-mounts the /nix/store driver libs, runs the update-ldcache
        # hook. Required because kubelet ≥1.28 no longer propagates pod
        # annotations to container CRI annotations, so containerd's native
        # CDI annotation injection can't reach these system pods. The
        # `nvidia` RuntimeClass is registered by k3s once nvidia-container-runtime
        # is on its service PATH and the runtime is forced into CDI mode
        # via /etc/nvidia-container-runtime/config.toml (see
        # nixos/nodes/gpu01/configuration.nix). Workload pods still get
        # GPUs via the device-plugin API + CDI list strategy below; the
        # runtime class is only needed for the bootstrap pods.
        runtimeClassName: nvidia

        # CDI list strategy: at runtime the plugin returns CDI device names
        # (nvidia.com/gpu=0, ...) from /var/run/cdi/*.json to kubelet, which
        # containerd (≥2.0, enable_cdi defaults true) then resolves into
        # device/mount/hook edits applied to *workload* pods via the device
        # plugin API. This is the modern post-1.28 CDI flow.
        #
        # nvidiaDriverRoot is intentionally unset so the chart skips mounting
        # the host driver root at /driver-root. The plugin's NVML probe walks
        # /driver-root/usr/lib64/... and silently fails (no such directory),
        # falls back to bare `dlopen("libnvidia-ml.so.1")` which resolves via
        # the ld.so.cache the CDI `update-ldcache` hook populates at container
        # start from the /nix/store driver path.
        deviceListStrategy: cdi-annotations

        # Node Feature Discovery — labels nodes by hardware (PCI/CPU).
        nfd:
          enabled: true
          worker:
            tolerations:
              - operator: Exists

        # GPU Feature Discovery — adds nvidia.com/gpu.{product,memory,...}
        # labels. Same bootstrap mechanism as the plugin pod: CDI injection
        # via runtimeClassName: nvidia provides /dev/nvidia* and the driver
        # libs, so NVML.Init succeeds.
        gfd:
          enabled: true
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
