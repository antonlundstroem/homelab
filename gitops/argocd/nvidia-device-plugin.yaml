apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.19.1
    helm:
      valuesObject:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

        # CDI mode: device plugin advertises GPUs as CDI references; containerd
        # (≥2.0, CDI on by default) reads /var/run/cdi/nvidia-container-toolkit.json
        # and injects devices + driver libs into workload pods.
        deviceListStrategy: cdi-annotations

        # Point at the FHS-shaped wrapper provisioned on the host (see
        # nixos/nodes/gpu01/configuration.nix), NOT at /run/opengl-driver
        # directly. The chart bind-mounts this path as /driver-root in the
        # pod; the plugin's NVML probe walks /driver-root/usr/lib64/... for
        # libnvidia-ml.so.1, which only resolves because the wrapper exposes
        # /run/opengl-driver/lib at .../usr/lib64.
        nvidiaDriverRoot: /var/lib/nvidia-driver-root

        # The plugin pod itself still has to enumerate GPUs via NVML, which
        # needs /dev/nvidiactl + the driver libs to actually dlopen. The CDI
        # annotation tells containerd to apply the CDI spec on pod start,
        # which mounts the /nix/store driver path and runs update-ldcache so
        # the symlinks under /driver-root resolve at load time.
        podAnnotations:
          cdi.k8s.io/gpu: "nvidia.com/gpu=all"

        # Node Feature Discovery — labels nodes by hardware (PCI/CPU).
        nfd:
          enabled: true
          worker:
            tolerations:
              - operator: Exists

        # GPU Feature Discovery — adds nvidia.com/gpu.{product,memory,...}
        # labels. Same bootstrap story as the plugin: FHS wrapper for the
        # NVML probe + CDI annotation so dlopen actually resolves.
        gfd:
          enabled: true
          nvidiaDriverRoot: /var/lib/nvidia-driver-root
          podAnnotations:
            cdi.k8s.io/gpu: "nvidia.com/gpu=all"
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
