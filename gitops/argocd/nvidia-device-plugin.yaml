apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.17.1
    helm:
      valuesObject:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

        # CDI mode: device plugin advertises GPUs as CDI references; containerd
        # reads /var/run/cdi/nvidia-container-toolkit.json and injects devices.
        deviceListStrategy: cdi-annotations
        nvidiaDriverRoot: /run/opengl-driver

        # Bootstrap: the plugin's own pod needs /dev/nvidiactl + driver libs to
        # run NVML and enumerate cards. Rather than hostPath-mount /dev (big
        # hammer), use the same CDI spec containerd will use for workload pods
        # — annotate the pod and containerd injects everything from CDI.
        runtimeClassName: ""
        podAnnotations:
          cdi.k8s.io/gpu: "nvidia.com/gpu=all"

        # Node Feature Discovery — labels nodes by hardware (PCI/CPU).
        nfd:
          enabled: true
          worker:
            tolerations:
              - operator: Exists

        # GPU Feature Discovery — adds nvidia.com/gpu.{product,memory,...}
        # labels. Needs the same NixOS driver root for its own NVML calls.
        gfd:
          enabled: true
          nvidiaDriverRoot: /run/opengl-driver
          deviceListStrategy: cdi-annotations
          podAnnotations:
            cdi.k8s.io/gpu: "nvidia.com/gpu=all"
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
