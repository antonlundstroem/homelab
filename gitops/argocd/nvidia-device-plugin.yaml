apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.17.1
    helm:
      valuesObject:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

        # Node Feature Discovery — detects PCI/CPU features on every node and
        # writes feature.node.kubernetes.io/* labels (incl. pci-10de.present
        # for NVIDIA hardware).
        nfd:
          enabled: true
          worker:
            tolerations:
              - operator: Exists

        # GPU Feature Discovery — runs only on nodes NFD flagged as having
        # NVIDIA hardware, adds nvidia.com/gpu.{product,memory,present,...}.
        # The device plugin's default affinity keys off these.
        gfd:
          enabled: true
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
