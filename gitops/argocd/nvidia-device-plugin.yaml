apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.19.1
    helm:
      valuesObject:
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

        # Route plugin + gfd pods through nvidia-container-runtime, which
        # applies the CDI spec on container start: mounts /dev/nvidia*,
        # bind-mounts the /nix/store driver libs, runs the update-ldcache
        # hook. Required because kubelet ≥1.28 no longer propagates pod
        # annotations to container CRI annotations, so containerd's native
        # CDI annotation path can't inject these system pods. RuntimeClass
        # is registered by k3s when nvidia-container-runtime appears on its
        # service PATH (see nixos/nodes/gpu01/configuration.nix). Workload
        # pods still get GPUs via the device-plugin API + CDI list strategy
        # below; the runtime class is only needed for the bootstrap pods.
        runtimeClassName: nvidia

        # CDI list strategy: at runtime the plugin returns CDI device names
        # (nvidia.com/gpu=0, ...) from /var/run/cdi/*.json to kubelet, which
        # containerd (≥2.0, enable_cdi defaults true) then resolves into
        # device/mount/hook edits applied to *workload* pods via the device
        # plugin API. This is the modern post-1.28 CDI flow.
        deviceListStrategy: cdi-annotations

        # Point at the FHS-shaped wrapper provisioned on the host (see
        # nixos/nodes/gpu01/configuration.nix, which bind-mounts the leaf
        # nvidia-x11 lib dir as .../usr/lib64). Required so the plugin's
        # own NVML probe (go-nvlib path walk) succeeds at startup —
        # validation gate for `deviceListStrategy=cdi-annotations`. The
        # actual runtime path doesn't call NVML.Init under CDI list mode,
        # so the bootstrap pod doesn't need /dev/nvidia* device nodes.
        nvidiaDriverRoot: /var/lib/nvidia-driver-root

        # podAnnotations CDI flow (cdi.k8s.io/<key>: <vendor>/<class>=<dev>)
        # is dead weight on k8s ≥1.28 — kubelet no longer propagates pod
        # annotations to CRI container annotations, so containerd's CDI
        # processing never sees them. Left here as documentation of intent
        # in case kubelet behavior changes back upstream; the wrapper above
        # is what actually unblocks the probe today.
        podAnnotations:
          cdi.k8s.io/gpu: "nvidia.com/gpu=all"

        # Node Feature Discovery — labels nodes by hardware (PCI/CPU).
        nfd:
          enabled: true
          worker:
            tolerations:
              - operator: Exists

        # GPU Feature Discovery — adds nvidia.com/gpu.{product,memory,...}
        # labels. FHS wrapper unblocks the strategy=auto probe (otherwise
        # bails with "unsupported strategy auto"). UNRESOLVED: gfd actually
        # calls NVML.Init to query device props at runtime, which needs
        # /dev/nvidiactl. The chart doesn't mount it into the gfd pod, so
        # expect a runtime failure here even with the wrapper in place; if
        # so, treat gfd separately (custom DaemonSet or skip gfd labels for
        # now — NFD still labels the node).
        gfd:
          enabled: true
          nvidiaDriverRoot: /var/lib/nvidia-driver-root
          podAnnotations:
            cdi.k8s.io/gpu: "nvidia.com/gpu=all"
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
