apiVersion: v1
kind: ConfigMap
metadata:
  name: homeowner-config
data:
  # Search settings (spec: config-file, read-only in UI). Edit + restart the Deployment
  # to change the search — no image rebuild. db.path points at the PVC mount.
  config.toml: |
    [booli]
    # one tab per area; lat/lon = the area's own city center (local "nära stad" anchor)
    areas = [
      { id = 318, name = "Örebro", lat = 59.2741, lon = 15.2066 },  # 318 = Örebro län
      { id = 880, name = "Motala", lat = 58.5372, lon = 15.0364 },
      { id = 393, name = "Linköping", lat = 58.4108, lon = 15.6214 },
      { id = 252, name = "Norrköping", lat = 58.5877, lon = 16.1924 },
    ]
    min_list_price = 2500000
    max_list_price = 4500000

    [hemnet]
    # Hemnet mirror of [booli] areas; `area` = the Booli tab its listings land on.
    # Price band + Villa,Gård shared with [booli]. Ids: SPIKE-hemnet.md (homeowner repo).
    locations = [
      { id = 17757, area = 318 },   # Örebro län
      { id = 17995, area = 880 },   # Motala kommun
      { id = 17847, area = 393 },   # Linköpings kommun
      { id = 18002, area = 252 },   # Norrköpings kommun
    ]

    [economy]
    # per-listing cost view defaults (spec-economy-view.md, homeowner repo);
    # kontantinsats/ränta/bud are overridable in the UI toolbar per request
    kontantinsats_pct = 10
    interest = 3.5
    underhall_kr_m2 = 150
    budfaktor = 1.05
    extra_monthly = [
      { name = "Bredband", kr = 400 },
    ]

    [scoring]
    model = "claude-sonnet-5"

    [refresh]
    interval_hours = 24

    [db]
    path = "/data/homeowner.db"

    [distances]
    ors_url = "http://openrouteservice.openrouteservice.svc.cluster.local:8080"
    # Shared anchors: every card shows these ON TOP of its own area's city
    # ([booli] areas); nearest flagged. Add a city + restart the Deployment and
    # the next refresh enriches it (ORS-only, cached).
    cities = [
      { name = "Motala", lat = 58.5372, lon = 15.0364 },
      { name = "Sandviken", lat = 60.6166, lon = 16.7758 },
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeowner
  labels: { app: homeowner }
spec:
  replicas: 1 # single writer — SQLite on a RWO PVC, no concurrency
  strategy: { type: Recreate } # never two pods on the same SQLite file
  selector:
    matchLabels: { app: homeowner }
  template:
    metadata:
      labels: { app: homeowner }
    spec:
      imagePullSecrets:
        - name: ghcr-pull # read-only GHCR token (SealedSecret, bootstrap step)
      containers:
        - name: homeowner
          # ponytail: pin the sha-<short> tag from the first CI build; bump it here to deploy.
          image: ghcr.io/antonlundstroem/homeowner:sha-eb30f14
          ports:
            - containerPort: 8000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homeowner-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true # UI serves without it; only scoring needs the key
            - name: HOMEOWNER_CONFIG
              value: /app/config.toml
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homeowner-data
        - name: config
          configMap:
            name: homeowner-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeowner
spec:
  selector: { app: homeowner }
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeowner
spec:
  # Tailscale operator provisions https://homeowner.<tailnet>.ts.net from tls.hosts[0].
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: homeowner
      port:
        number: 80
  tls:
    - hosts:
        - homeowner
