---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: in-cluster
    kind: ClusterSecretStore
  target:
    name: mlops-repo-secrets
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
        data:
          type: git
          url: https://github.com/antonlundstroem/mlops.git
          username: "{{ .USERNAME }}"
          password: "{{ .PASSWORD }}"

  data:
    - secretKey: USERNAME
      remoteRef: { key: github-secrets, property: username }
    - secretKey: PASSWORD
      remoteRef: { key: github-secrets, property: token }
