apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: track-a-001
  namespace: models
  annotations:
    serving.kserve.io/autoscalerClass: none
spec:
  predictor:
    # For non-hpa setting
    minReplicas: 1
    maxReplicas: 1
    serviceAccountName: sa-rustfs
    model:
      protocolVersion: v2
      modelFormat:
        name: sklearn
      storageUri: "s3://mlflow/2/models/m-826811ab96804f8c96865d13fe9533a0/artifacts"
---
# kserve's Ingress uses rules[].host which Tailscale's controller ignores;
# we disable kserve ingress and expose the predictor Service via SSA patch instead.
apiVersion: v1
kind: Service
metadata:
  name: track-a-001-predictor
  namespace: models
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: track-a-001
