apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-rustfs
  namespace: models
secrets:
  - name: rustfs-creds
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: track-a-001
  namespace: models
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    serviceAccountName: sa-rustfs
    model:
      modelFormat: { name: sklearn }
      storageUri: s3://mlflow/models/iris/1 # or gs://, https://, pvc://, etc.
