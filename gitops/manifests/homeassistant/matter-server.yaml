apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-server
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/python-matter-server:stable
          ports:
            - containerPort: 5580
          securityContext:
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server
---
apiVersion: v1
kind: Service
metadata:
  name: matter-server
spec:
  selector:
    app: matter-server
  ports:
    - port: 5580
      targetPort: 5580
