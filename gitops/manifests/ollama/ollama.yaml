apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  # RWO PVC for the model store: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # gpu01 is tainted nvidia.com/gpu=true:NoSchedule, so tolerate it. The
      # nvidia.com/gpu limit below triggers GPU injection (device plugin + CDI);
      # Ollama auto-detects CUDA and offloads what fits, spilling the rest to CPU.
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:latest # pin a tag for reproducibility
          env:
            # Default bind is 127.0.0.1, unreachable from other pods — listen wide.
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Keep a model resident between requests instead of unloading at once.
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
