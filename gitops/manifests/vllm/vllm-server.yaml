apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service below is named `vllm`, so k8s' default Docker-link env injection
      # sets VLLM_PORT=tcp://<clusterIP>:8000 in this pod — which collides with vLLM's
      # own VLLM_PORT config var (it expects an int) and crashes engine startup. Disable
      # the legacy link vars; CoreDNS service discovery (vllm.vllm.svc) is unaffected.
      enableServiceLinks: false
      # gpu01 is tainted nvidia.com/gpu=true:NoSchedule, so tolerate it to land
      # on the GPU node. The nvidia.com/gpu limit below is what actually triggers
      # GPU injection (device plugin + CDI) — the toleration alone doesn't.
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest # pin a tag for reproducibility
          args:
            - --model=Qwen/Qwen2.5-1.5B-Instruct
            - --max-model-len=8192
            - --gpu-memory-utilization=0.90
          env:
            # Keep the HuggingFace download cache on the PVC, not the image layer.
            - name: HF_HOME
              value: /models
            # Read token for pulling gated weights (Llama/Gemma/...). Sourced from the
            # vllm-secrets SealedSecret (key hf-token); public models work without it.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: hf-token
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            # ~15 min budget: first boot downloads weights (disposable PVC) then
            # runs torch.compile + CUDA-graph capture before binding :8000.
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
