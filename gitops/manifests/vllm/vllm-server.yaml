apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # gpu01 is tainted nvidia.com/gpu=true:NoSchedule, so tolerate it to land
      # on the GPU node. The nvidia.com/gpu limit below is what actually triggers
      # GPU injection (device plugin + CDI) — the toleration alone doesn't.
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest # pin a tag for reproducibility
          args:
            - --model=Qwen/Qwen2.5-1.5B-Instruct
            - --max-model-len=8192
            - --gpu-memory-utilization=0.90
          env:
            # Keep the HuggingFace download cache on the PVC, not the image layer.
            - name: HF_HOME
              value: /models
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            # ~5 min budget for first-run weight download + model load.
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
