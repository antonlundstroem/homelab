apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  # RWO PVC + single-writer SQLite: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # No GPU toleration on purpose — this is a plain web app, so it schedules
      # on node01/node02 and stays up even when gpu01 is powered off.
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main # pin a tag for reproducibility
          env:
            # Point at the in-cluster vLLM OpenAI-compatible API.
            - name: OPENAI_API_BASE_URL
              value: http://vllm.vllm.svc.cluster.local:8000/v1
            - name: OPENAI_API_KEY
              value: dummy # vLLM is unauthenticated unless --api-key is set
            - name: ENABLE_OLLAMA_API
              value: "false"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            # First boot runs DB migrations; gate liveness so it can't restart-loop.
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          volumeMounts:
            # All state (chats, personas, users, settings) is one SQLite file here.
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: open-webui
      port:
        number: 8080
  tls:
    - hosts:
        - chat
