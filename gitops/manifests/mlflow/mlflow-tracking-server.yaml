apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-tracking-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow-tracking-server
  template:
    metadata:
      labels:
        app: mlflow-tracking-server
    spec:
      containers:
        - name: mlflow-tracking-server
          image: ghcr.io/mlflow/mlflow #:v3.12.0-full
          args:
            - mlflow
            - server
            - --host=0.0.0.0
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-tracking-server
spec:
  selector:
    app: mlflow-tracking-server
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow-tracking-server
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: mlflow-tracking-server
      port:
        number: 5000
  tls:
    - hosts:
        - mlflow
