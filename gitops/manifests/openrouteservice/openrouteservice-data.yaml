apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openrouteservice-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # Sweden pbf (~700 MB) + built graphs for 2 profiles. Disposable — the init
      # container re-downloads and ORS rebuilds if lost (slow, not painful).
      storage: 20Gi
