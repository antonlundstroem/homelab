apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-external-secrets
  namespace: argo-workflows
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: in-cluster
    kind: ClusterSecretStore
  target:
    name: rustfs-secrets
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: rustfs-secrets, property: access_key }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: rustfs-secrets, property: secret_key }
