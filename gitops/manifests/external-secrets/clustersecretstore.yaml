---
apiVersion: v1
kind: Namespace
metadata:
  name: shared-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader
  namespace: shared-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-reader
  namespace: shared-secrets
subjects:
  - kind: ServiceAccount
    name: eso-reader
    namespace: external-secrets
roleRef:
  kind: Role
  name: eso-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: in-cluster
spec:
  provider:
    kubernetes:
      remoteNamespace: shared-secrets
      auth:
        serviceAccount:
          name: eso-reader
          namespace: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
